[project]
name = "agentic-research-workflow"
version = "0.1.0"
description = "A compact, interview-ready agentic workflow research project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jupyterlab==4.5.6",
  "matplotlib==3.10.8",
  "numpy==2.4.3",
  "pandas==3.0.1",
  "pydantic==2.12.0",
  "python-dateutil==2.9.0.post0",
  "rich==14.2.0",
  "scikit-learn==1.8.0",
  "tqdm==4.67.1",
]

[dependency-groups]
dev = [
  "ipykernel==7.2.0",
  "pytest==9.0.2",
]

[tool.uv]
package = false
default-groups = ["dev"]
