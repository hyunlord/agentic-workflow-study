[project]
name = "agentic-research-workflow"
version = "0.1.0"
description = "A compact, interview-ready agentic workflow research project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "jupyterlab==4.5.6",
  "markdownify>=0.14",
  "matplotlib==3.10.8",
  "numpy==2.4.3",
  "pandas==3.0.1",
  "pydantic==2.12.0",
  "python-dateutil==2.9.0.post0",
  "requests==2.32.5",
  "rich==14.2.0",
  "scikit-learn==1.8.0",
  "tqdm==4.67.1",
]

[project.optional-dependencies]
cpu = [
  "faiss-cpu>=1.12.0",
  "sentence-transformers>=5.2.3",
  "torch>=2.2",
]
finetuning = [
  "accelerate>=1.5",
  "bitsandbytes>=0.45 ; platform_system == 'Linux'",
  "datasets>=3.5",
  "peft>=0.15",
  "trl>=0.18",
]
gpu = [
  "faiss-gpu-cu12>=1.8.0 ; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "sentence-transformers>=5.2.3",
  "torch>=2.2",
]

[dependency-groups]
dev = [
  "ipykernel==7.2.0",
  "pytest==9.0.2",
]

[tool.uv]
package = false
default-groups = ["dev"]
